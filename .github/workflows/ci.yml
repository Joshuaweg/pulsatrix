name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # No -G on Windows: windows-latest's bundled Visual Studio version is a moving
          # target GitHub updates on its own schedule (it jumped from VS2022 to VS2026
          # under this exact label, breaking a hardcoded "Visual Studio 17 2022" generator
          # name with no code change on our side). Omitting -G lets CMake auto-detect
          # whichever VS version is actually installed on the runner.
          - os: windows-latest
            generator: ""
            extra-configure-args: -A x64
          - os: ubuntu-latest
            generator: "Unix Makefiles"
            extra-configure-args: -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.generator }}" ]; then
            cmake -S . -B build -G "${{ matrix.generator }}" ${{ matrix.extra-configure-args }}
          else
            cmake -S . -B build ${{ matrix.extra-configure-args }}
          fi

      - name: Build
        run: cmake --build build --config Release

      # mnist_loader_test / mnist_classifier_example_test need real MNIST files that
      # tools/fetch_mnist.py populates manually (see that script's docstring: "Not run
      # by CTest/CI -- this is a data-acquisition tool, not a test dependency"). Excluded
      # here by design, not an oversight.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -E "Mnist"
