name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    # A fixed name per OS: branch protection requires checks by name, and GitHub's default
    # name lists every matrix value, so changing any build detail would orphan the requirement.
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            launcher: sccache
            compilers: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          - os: ubuntu-latest
            launcher: ccache
            compilers: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Ninja on both platforms. It builds in parallel by default and, unlike the Visual Studio
      # generator, supports a compiler launcher (the cache below). It also sidesteps the old
      # problem of windows-latest moving between Visual Studio versions: Ninja uses whichever
      # MSVC msvc-dev-cmd finds.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        shell: bash
        run: |
          if ! command -v ninja >/dev/null; then
            if [ "$RUNNER_OS" = "Windows" ]; then choco install ninja -y --no-progress; else sudo apt-get install -y -qq ninja-build; fi
          fi
          ninja --version

      # Restores the object cache from this branch, or master's for a new branch, and saves it
      # after the job. A PR that touches a few files recompiles only those.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-and-test-${{ matrix.os }}
          variant: ${{ matrix.launcher }}
          max-size: 500M

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.compilers }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.launcher }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.launcher }}

      - name: Build
        run: cmake --build build --parallel

      # mnist_loader_test / mnist_classifier_example_test need real MNIST files that
      # tools/fetch_mnist.py populates manually (see that script's docstring: "Not run
      # by CTest/CI -- this is a data-acquisition tool, not a test dependency"). Excluded
      # here by design, not an oversight. Tests run 4 at a time, one per runner core; every
      # test that writes files uses its own temporary path.
      - name: Test
        run: ctest --test-dir build --output-on-failure -E "Mnist" --parallel 4

  # The pytest suite was never run in CI and drifted out of date when LinearModule/Conv2D
  # moved to batched inputs. CPU-only here; GPU binding tests skip themselves when the build
  # has no GPU backend.
  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # torch (CPU wheels) and safetensors run the legacy-pickle converter's tests (IO-3).
        run: python -m pip install numpy pytest safetensors torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Build bindings
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPULSATRIX_ENABLE_PYTHON=ON \
            -DPYTHON_EXECUTABLE="$(which python)"
          cmake --build build -j"$(nproc)" --target pulsatrix_py

      - name: Test
        run: PYTHONPATH=build python -m pytest -q tests/python

  # Compile-only: hosted runners have no GPU, so this catches a backend that no longer builds
  # (e.g. HIPBackend going abstract when DeviceBackend grows) but cannot run the GPU tests.
  # Those still need real hardware -- see scripts/rocm-build.sh.
  gpu-compile:
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, hip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain images are 5-12 GB and grow further during the build; reclaim space
      # from preinstalled SDKs this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # ccache inside the toolchain container, persisted between runs like the job above.
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: gpu-${{ matrix.backend }}-${{ github.sha }}
          restore-keys: gpu-${{ matrix.backend }}-

      - name: Compile ${{ matrix.backend }} backend
        env:
          CCACHE_HOST_DIR: ${{ runner.temp }}/ccache
        run: scripts/ci-gpu-compile.sh ${{ matrix.backend }}
