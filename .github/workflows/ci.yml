name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # No -G on Windows: windows-latest's bundled Visual Studio version is a moving
          # target GitHub updates on its own schedule (it jumped from VS2022 to VS2026
          # under this exact label, breaking a hardcoded "Visual Studio 17 2022" generator
          # name with no code change on our side). Omitting -G lets CMake auto-detect
          # whichever VS version is actually installed on the runner.
          - os: windows-latest
            generator: ""
            extra-configure-args: -A x64
          - os: ubuntu-latest
            generator: "Unix Makefiles"
            extra-configure-args: -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.generator }}" ]; then
            cmake -S . -B build -G "${{ matrix.generator }}" ${{ matrix.extra-configure-args }}
          else
            cmake -S . -B build ${{ matrix.extra-configure-args }}
          fi

      - name: Build
        run: cmake --build build --config Release

      # mnist_loader_test / mnist_classifier_example_test need real MNIST files that
      # tools/fetch_mnist.py populates manually (see that script's docstring: "Not run
      # by CTest/CI -- this is a data-acquisition tool, not a test dependency"). Excluded
      # here by design, not an oversight.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -E "Mnist"

  # The pytest suite was never run in CI and drifted out of date when LinearModule/Conv2D
  # moved to batched inputs. CPU-only here; GPU binding tests skip themselves when the build
  # has no GPU backend.
  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install numpy pytest

      - name: Build bindings
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPULSATRIX_ENABLE_PYTHON=ON \
            -DPYTHON_EXECUTABLE="$(which python)"
          cmake --build build -j"$(nproc)" --target pulsatrix_py

      - name: Test
        run: PYTHONPATH=build python -m pytest -q tests/python

  # Compile-only: hosted runners have no GPU, so this catches a backend that no longer builds
  # (e.g. HIPBackend going abstract when DeviceBackend grows) but cannot run the GPU tests.
  # Those still need real hardware -- see scripts/rocm-build.sh.
  gpu-compile:
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, hip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain images are 5-12 GB and grow further during the build; reclaim space
      # from preinstalled SDKs this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Compile ${{ matrix.backend }} backend
        run: scripts/ci-gpu-compile.sh ${{ matrix.backend }}
